<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Memorama de perros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="stats">
    <ion-chip>
      <span>Pares:&nbsp;</span><ion-badge color="tertiary">{{ matches }}/{{ pairs }}</ion-badge>
    </ion-chip>
    <ion-chip>
      <span>Intentos:&nbsp;</span><ion-badge color="tertiary">{{ attempts }}</ion-badge>
    </ion-chip>
    <ion-button size="small" fill="outline" (click)="newGame()">Reiniciar</ion-button>
  </div>

  @if (finished) {
    <div class="message">¡Completado! Toca “Reiniciar” para jugar otra vez.</div>
  }

  <ion-grid class="board">
    <ion-row>
      @for (c of cards; track c.id) {
        <ion-col size="3" size-md="2" size-lg="2">
          <button class="card"
                  [class.revealed]="c.revealed || c.matched"
                  [class.matched]="c.matched"
                  [disabled]="boardLocked || c.matched"
                  (click)="onCardClick(c)">

            <div class="face back">?</div>
            <div class="face front">
              <img [src]="c.imagenUrl" class="card-img" alt="Perro" />
            </div>
          </button>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
